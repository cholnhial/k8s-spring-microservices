apiVersion: v1
kind: Secret
metadata:
  name: keycloak-shopnow-realm
  namespace: shopnow
  labels:
    app: keycloak
    part-of: shopnow
    version: "1.0"
type: Opaque
stringData:
  shopnow-realm.json: |
    {
      "realm": "shopnow",
      "enabled": true,
      "displayName": "ShopNow",
      "accessTokenLifespan": 30,
      "accessTokenLifespanForImplicitFlow": 30,
      "ssoSessionIdleTimeout": 300,
      "ssoSessionMaxLifespan": 600,
      "roles": {
        "realm": [
          {
            "name": "service",
            "description": "Service-to-service caller"
          },
          {
            "name": "product.read"
          },
          {
            "name": "inventory.read"
          },
          {
            "name": "order.write"
          }
        ]
      },
      "clients": [
        {
          "clientId": "api-gateway",
          "name": "api-gateway",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "api-gateway-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "order-service",
          "name": "order-service",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "order-service-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "product-service",
          "name": "product-service",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "product-service-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "inventory-service",
          "name": "inventory-service",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "inventory-service-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "user-service",
          "name": "user-service",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "user-service-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "cart-service",
          "name": "cart-service",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "cart-service-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "notification-service",
          "name": "notification-service",
          "enabled": true,
          "protocol": "openid-connect",
          "clientAuthenticatorType": "client-secret",
          "secret": "notification-service-dev-secret",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false
        }
      ],
      "users": [
        {
          "username": "service-account-api-gateway",
          "enabled": true,
          "serviceAccountClientId": "api-gateway",
          "realmRoles": [
            "service"
          ]
        },
        {
          "username": "service-account-order-service",
          "enabled": true,
          "serviceAccountClientId": "order-service",
          "realmRoles": [
            "service",
            "product.read",
            "inventory.read",
            "order.write"
          ]
        },
        {
          "username": "service-account-product-service",
          "enabled": true,
          "serviceAccountClientId": "product-service",
          "realmRoles": [
            "service",
            "product.read"
          ]
        },
        {
          "username": "service-account-inventory-service",
          "enabled": true,
          "serviceAccountClientId": "inventory-service",
          "realmRoles": [
            "service",
            "inventory.read"
          ]
        },
        {
          "username": "service-account-user-service",
          "enabled": true,
          "serviceAccountClientId": "user-service",
          "realmRoles": [
            "service"
          ]
        },
        {
          "username": "service-account-cart-service",
          "enabled": true,
          "serviceAccountClientId": "cart-service",
          "realmRoles": [
            "service"
          ]
        },
        {
          "username": "service-account-notification-service",
          "enabled": true,
          "serviceAccountClientId": "notification-service",
          "realmRoles": [
            "service"
          ]
        }
      ]
    }
