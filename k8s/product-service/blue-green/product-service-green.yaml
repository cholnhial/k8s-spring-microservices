apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-green
  namespace: shopnow
  labels:
    app: product-service
    part-of: shopnow
    version: "1.0"
    slot: green
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: product-service
      slot: green
  template:
    metadata:
      labels:
        app: product-service
        part-of: shopnow
        version: "1.0"
        slot: green
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: product-service
          image: shopnow/product-service:latest
          imagePullPolicy: Never
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: product-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-credentials
                  key: POSTGRES_PASSWORD
            - name: LOGGING_FILE_NAME
              value: /var/log/app/app.log
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
        - name: log-shipper
          image: busybox:1.36
          command:
            - sh
            - -c
            - while [ ! -f /var/log/app/app.log ]; do sleep 2; done; tail -n +1 -f /var/log/app/app.log
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "25m"
      volumes:
        - name: app-logs
          emptyDir: {}
