apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: shopnow
  labels:
    app: zookeeper
    part-of: shopnow
    version: "1.0"
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        part-of: shopnow
        version: "1.0"
    spec:
      containers:
        - name: zookeeper
          image: bitnamilegacy/zookeeper:3.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 2181
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /bitnami/zookeeper
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
        labels:
          app: zookeeper
          part-of: shopnow
          version: "1.0"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
